  <g id="text_7">
   <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #102a43" x="16.2" y="23.916562" transform="rotate(-0 16.2 23.916562)">Three explicit evolutionary hypotheses are compared by maximum likelihood and the AU test</text>
  </g>
  <g id="text_8">
   <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7785" x="16.2" y="47.802047" transform="rotate(-0 16.2 47.802047)">The test asks whether cassette sequences retain isoform identity across species or preferentially pair within species.</text>
