<text x="14" y="179.2" font-family="Helvetica, Arial, 'Nimbus Sans', 'DejaVu Sans', sans-serif" font-size="6.6" fill="#6B7280" text-anchor="start" font-weight="normal">A small difference is evidence of a consistent boundary position, not of evolutionary conservation.</text>
