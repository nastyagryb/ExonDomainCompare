name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints-py313-tested.txt
      - name: Install Python dependencies
        run: python -m pip install -c requirements/constraints-py313-tested.txt -e '.[test,render,synteny]'
      - name: Check public release files
        run: python scripts/release/check_public_release.py
      - name: Run Python tests
        run: python -m pytest -p no:cacheprovider -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Check frontend parity
        run: npm run parity
      - name: Build frontend
        run: npm run build
