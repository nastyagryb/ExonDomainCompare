# Copy to config/exondomain.local.toml (ignored by Git) and replace placeholders.
schema_version = "1.0"
active_local_profile = "workstation"
active_lrz_profile = "research-cluster"

[local_profiles.workstation]
runs_root = "/PATH/TO/LOCAL/RUNS"
data_dir = "/PATH/TO/LOCAL/DATA"
config_dir = "/PATH/TO/LOCAL/CONFIG"
cache_dir = "/PATH/TO/LOCAL/CACHE"
logs_dir = "/PATH/TO/LOCAL/LOGS"
temp_dir = "/PATH/TO/LOCAL/TEMP"
packages_dir = "/PATH/TO/LOCAL/PACKAGES"
datasets_dir = "/PATH/TO/LOCAL/DATASETS"
registry_dir = "/PATH/TO/LOCAL/REGISTRY"
python = "python"
node = "node"
npm = "npm"
datasets = "datasets"
mafft = "mafft"
ssh = "ssh"
scp = "scp"
rsync = "rsync"
diamond = "diamond"
blastp = "blastp"
makeblastdb = "makeblastdb"
d2 = "d2"
typst = "typst"
rsvg_convert = "rsvg-convert"

[lrz_profiles.research-cluster]
user = "LRZ_USER"
host = "LRZ_LOGIN_HOST"
remote_root = "/REMOTE/PROJECT/RUNS"
remote_work_dir = "/REMOTE/PROJECT/WORK"
remote_temp_dir = "/REMOTE/PROJECT/TEMP"
account = ""
partition = "SLURM_PARTITION"
scheduler_submit = "sbatch"
scheduler_status = "squeue"
scheduler_accounting = "sacct"
ssh_options = []
scp_options = []
rsync_options = []
poll_minutes = 2.0
max_hours = 12.0
managed_tool_root = "~/.local/share/ExonDomainCompare"

[lrz_profiles.research-cluster.interproscan]
launcher = "/PATH/TO/interproscan.sh"
module = ""
environment = "/PATH/TO/INTERPROSCAN/ENV"
time = "08:00:00"
cpus = 4
memory = "24G"

[lrz_profiles.research-cluster.pytmhmm]
launcher = "pyTMHMM"
module = ""
environment = "/PATH/TO/PYTMHMM/ENV"
python = "python"
time = "02:00:00"
cpus = 1
memory = "8G"
